<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06100a">
  <title>Offline · Command Cabinet</title>
  <style>
    :root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06100a;color:#dcffe5;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.panel{max-width:480px;padding:36px;margin:24px;border:1px solid #24553a;border-radius:10px;background:#0a1710;box-shadow:inset 0 1px 0 rgba(84,237,136,.08)}p{color:#8dc9a0}button{border:1px solid #54ed88;border-radius:5px;background:#123921;color:#dcffe5;font:700 14px system-ui;padding:10px 14px;cursor:pointer}code{color:#54ed88}
  </style>
</head>
<body>
  <main class="panel">
    <p>Command Cabinet</p>
    <h1>You’re offline</h1>
    <p>Reconnect to load your team’s command catalog. For privacy, command data and signed-in pages are not stored for offline use.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
